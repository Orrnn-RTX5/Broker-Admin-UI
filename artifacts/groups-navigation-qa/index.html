<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Groups navigation check</title></head>
<body style="margin:0"><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import SidebarNavTree from '/src/components/organisms/SidebarNavTree.jsx';
import { ManagerService } from '/src/services/manager.service.js';
import { AccountsService } from '/src/services/accounts.service.js';
import { useAuthStore } from '/src/store/authStore.js';
import '/src/index.css';

// Isolated fixtures: these replace the service methods only in this QA page.
useAuthStore.setState({ isAuthenticated: true, user: { permissions: ['manage_groups', 'view_accounts'] } });
const groups = ['real', 'demo', 'empty', ...Array.from({ length: 102 }, (_, i) => `group-${i + 1}`)];
let accounts = Array.from({ length: 8 }, (_, i) => ({ Login: String(i + 1), Group: i < 4 ? 'real' : 'demo' }));
accounts.push({ Login: '999', Group: 'demo-pro' });
const calls = [];
ManagerService.getGroupList = async ({ page, limit }) => {
  calls.push({ type: 'groups', page });
  return { groups: groups.slice((page - 1) * limit, page * limit), total: groups.length };
};
let failDemo = true;
AccountsService.getAccounts = async ({ group, page, limit }) => {
  calls.push({ type: 'accounts', group, page });
  if (group === 'demo' && failDemo) { failDemo = false; throw new Error('Test transient failure'); }
  return { accounts: accounts.slice((page - 1) * limit, page * limit), total: accounts.length };
};
let refreshTrigger = 0;
const selected = [];
const root = createRoot(document.getElementById('root'));
const render = () => root.render(React.createElement(SidebarNavTree, {
  refreshTrigger,
  onNodeSelect: node => selected.push(node),
}));
render();
const waitFor = async (condition, description) => {
  for (let i = 0; i < 150; i += 1) {
    if (condition()) return;
    await new Promise(resolve => setTimeout(resolve, 40));
  }
  throw new Error(`Timed out: ${description}`);
};
const assert = (value, message) => { if (!value) throw new Error(message); };
const button = label => document.querySelector(`button[aria-label="${label}"]`);
const accountRow = login => [...document.querySelectorAll('.admin-tree-label')].find(el => el.textContent.trim() === login)?.parentElement;

window.runGroupsCheck = async () => {
  await waitFor(() => button('Expand Groups'), 'Groups node');
  assert(calls.length === 0, 'Collapsed navigator must not fetch data');
  button('Expand Groups').click();
  await waitFor(() => button('Expand group-102'), 'all 105 groups across two pages');
  assert(button('Collapse Admin'), 'Admin folder must wrap groups');
  assert(!calls.some(call => call.type === 'accounts'), 'Closed group folders must not load accounts');
  button('Expand real').click();
  await waitFor(() => accountRow('4'), 'real accounts');
  assert(accountRow('1') && !accountRow('5'), 'Real folder must contain only real accounts');
  button('Expand demo').click();
  await waitFor(() => document.querySelector('[role="alert"] button'), 'retry state');
  document.querySelector('[role="alert"] button').click();
  await waitFor(() => accountRow('8'), 'demo accounts after retry');
  assert(!accountRow('999'), 'demo-pro account must not appear in demo');
  accountRow('7').click();
  assert(selected.at(-1)?.type === 'group-account' && selected.at(-1)?.login === '7', 'account leaf must carry its real login');
  button('Expand empty').click();
  await waitFor(() => document.body.textContent.includes('No accounts'), 'empty group');
  accounts = accounts.map(account => account.Login === '1' ? { ...account, Group: 'demo' } : account);
  refreshTrigger += 1;
  render();
  await waitFor(() => [...document.querySelectorAll('.admin-tree-label')].some(el => el.textContent.trim() === 'demo(5)'), 'refreshed membership and count');
  assert(button('Collapse real') && button('Collapse demo'), 'Refresh must preserve expanded folders');
  assert([...document.querySelectorAll('.admin-tree-label')].some(el => el.textContent.trim() === 'real(3)'), 'Real count must update after moving an account');
  const text = document.body.textContent;
  assert(text.includes('Admin') && text.includes('(105)'), 'Group count must come from API data');
  return { groups: 105, realAccounts: 3, demoAccounts: 5, pagination: true, exactMembership: true, retry: true, refresh: true, accountSelection: true, calls: calls.length };
};
</script>
</body>
</html>
