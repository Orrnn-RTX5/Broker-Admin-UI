name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  publish-image:
    name: Build and publish GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-brokers:
    name: Trigger infra deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Trigger broker infra deploy
        shell: bash
        env:
          INFRA_REPO: ${{ github.repository_owner }}/ORRNN-RTX5-Broker-Infra
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$INFRA_TOKEN" ]]; then
            echo "INFRA_REPO_DISPATCH_TOKEN is required to trigger $INFRA_REPO" >&2
            exit 1
          fi

          payload="$(jq -n \
            --arg component "admin" \
            --arg image_ref "$IMAGE_REF" \
            --arg broker "myprop-trade" \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            '{event_type:"deploy-broker-component",client_payload:{component:$component,image_ref:$image_ref,broker:$broker,source_repo:$source_repo,source_sha:$source_sha}}')"

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $INFRA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$INFRA_REPO/dispatches" \
            -d "$payload"
