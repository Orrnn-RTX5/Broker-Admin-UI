name: CI - Build and Publish Admin UI Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: ui-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  publish-image:
    name: Build and publish GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.release_record.outputs.image_ref }}
      release_record: ${{ steps.release_record.outputs.release_record }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Record immutable image release
        id: release_record
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          release_record="$(jq -cn \
            --arg component "admin" \
            --arg source_sha "$GITHUB_SHA" \
            --arg image_ref "$image_ref" \
            '{component: $component, source_sha: $source_sha, image_ref: $image_ref}')"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "release_record=$release_record" >> "$GITHUB_OUTPUT"
          {
            echo "## Source image release"
            echo "\`\`\`json"
            echo "$release_record"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
