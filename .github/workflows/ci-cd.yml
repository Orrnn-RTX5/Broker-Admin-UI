name: CI - Build and Deploy Admin UI

on:
  push:
    branches:
      - main
      - 'release-candidate/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Broker deployment environment (configure its secrets first)
        type: environment
        required: true
        default: production

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/orrnn-rtx5/broker-admin-ui

concurrency:
  group: ui-image-${{ github.ref }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  publish-image:
    name: Build and publish image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.release_record.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image release
        id: release_record
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Build did not produce an immutable image digest.' >&2
            exit 1
          fi
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Image: $image_ref"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy configured broker environment
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    concurrency:
      group: admin-deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare admin runtime environment
        env:
          ADMIN_UI_ENV: ${{ secrets.ADMIN_UI_ENV }}
        run: node scripts/prepare-admin-env.mjs
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_IMAGE: ${{ needs.publish-image.outputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          ADMIN_CONTAINER_NAME: ${{ vars.ADMIN_CONTAINER_NAME }}
          ADMIN_PORT_MAPPING: ${{ vars.ADMIN_PORT_MAPPING }}
          ADMIN_UI_ENV_FILE: ${{ vars.ADMIN_UI_ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ADMIN_UI_ENV_B64,NEW_IMAGE,GHCR_TOKEN,GHCR_USERNAME,ADMIN_CONTAINER_NAME,ADMIN_PORT_MAPPING,ADMIN_UI_ENV_FILE
          script_path: scripts/deploy-admin-runtime.sh
