name: Admin Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Build and publish desktop release
        env:
          GH_TOKEN: ${{ secrets.RTX5_BROKER_ADMIN_RELEASES }}
        run: npm run release
