server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location = /runtime-config.js {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    error_page 404 = @missing_static;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    error_page 404 = @missing_static;
  }

  location @missing_static {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
}
